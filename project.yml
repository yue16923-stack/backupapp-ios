name: BackupApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  BackupApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.backupapp
        PRODUCT_NAME: BackupApp
        INFOPLIST_KEY_CFBundleDisplayName: WuDiTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSContactsUsageDescription: 配置通道
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 配置文件
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 占用空间
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
